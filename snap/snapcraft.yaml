name: deepseek-r1
title: DeepSeek R1
base: core24
summary: Local AI with DeepSeek R1 inference snap
description: |
  DeepSeek R1 is a reasoning language model from DeepSeek.

  Use this snap to quickly install an optimized environment for local inference with DeepSeek R1.

  The snap includes the following hardware-optimized inference engines:

  * cpu: Optimized for various CPUs, for a wide range of amd64 and arm64 architecture variants
  * nvidia-gpu: CUDA-optimized for NVIDIA GPUs
  * intel-cpu: Optimized for Intel CPUs using OpenVINO Model Server
  * intel-gpu: Optimized for Intel GPUs using OpenVINO Model Server
  * intel-npu: Optimized for Intel NPUs (Core Ultra series) using OpenVINO Model Server
  * ampere-altra: Optimized for Ampere Altra CPUs using llama-aio
  * ampere-one: Optimized for Ampere One CPUs using llama-aio

  The most suitable engine is automatically selected based on the available hardware.

  **Install:**

  `sudo snap install deepseek-r1`

  **Run:**

  `deepseek-r1`

  Some accelerators require extra drivers to be usable with this snap:
  https://documentation.ubuntu.com/inference-snaps/how-to/setup/drivers/

  **License:**

  The DeepSeek R1 model is provided by DeepSeek under the MIT License.

  The licenses of all the bundled software can be found after installing the snap at
  `/snap/deepseek-r1/current/usr/share/doc`.

icon: snap/gui/icon-256.png
website: https://documentation.ubuntu.com/inference-snaps
source-code: https://github.com/canonical/deepseek-r1-snap
issues: https://github.com/canonical/inference-snaps/issues

adopt-info: version

grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:

slots:
  provider:
    interface: content
    content: inference-provider
    source:
      read:
        - $SNAP_COMMON/share/provider

plugs:
  # For Intel NPU access
  intel-npu:
    interface: custom-device
    custom-device: intel-npu-device
  # NPU user-space libraries provided by the host through a content interface
  npu-libs:
    interface: content
    content: npu-libs-2404
    target: $SNAP/npu-libs
  # To allow side-loading models into server (root daemon) from user home directory
  home:
    read: all

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR
  # This is to find the intel.icd file, containing the path to libigdrcl.so
  # Required for Intel GPU detection and communication
  OCL_ICD_VENDORS: $SNAP/etc/OpenCL/vendors

layout:
  # OpenCL looks in /etc/OpenCL/vendors for .icd files containing the paths to shared objects
  /etc/OpenCL/vendors:
    bind: $SNAP/etc/OpenCL/vendors
  # Intel icd files use an absolute path to Intel OpenCL shared objects. Use a layout to mount the so files at the expected location
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl
  # Under wsl the libraries are expected in /usr/lib/wsl
  /usr/lib/wsl:
    bind: $SNAP_COMMON/usr/lib/wsl

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/modelctl version --format=json | jq .cli --raw-output)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      craftctl set version="${cli_version#v}+${git_hash}"

  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps/releases/download/v2.0.0-rc.1/modelctl-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps/releases/download/v2.0.0-rc.1/modelctl-linux-arm64.tar.xz
    plugin: dump
    override-build: |

      # For tab completion
      ln --symbolic ./modelctl bin/deepseek-r1

      craftctl default

  cli-dependencies:
    plugin: nil
    stage-packages:
      - pciutils # lspci
      - clinfo # used for Intel GPU vRAM detection. It depends on intel-opencl-icd

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead be provided by the host through the opengl interface.
  cli-nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/

      license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/
      mkdir -p $license_dir
      cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/

  # OpenCL ICD and libigdgmm are required for Intel GPU vRAM lookup with clinfo
  cli-intel-opencl-icd:
    source: https://github.com/canonical/intel-compute-runtime-bundle.git
    source-tag: 26.22.38646.4
    plugin: make
    make-parameters:
      - BUNDLE=intel-opencl-icd
    build-packages:
      - wget

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.1.0/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/

  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "server-webui.sh": bin/

  local-component-files:
    # Use the cmake plugin instead of "dump" to prevent unwanted copies
    # See https://github.com/canonical/craft-parts/issues/1609
    plugin: cmake
    source: components
    override-build:
      cp -rf --archive --link --no-dereference ${CRAFT_PART_SRC}/* ${CRAFT_PART_INSTALL}
    organize:
      "model-distill-qwen-1-5b-q8-0-gguf/*": (component/model-distill-qwen-1-5b-q8-0-gguf)
      "model-distill-qwen-7b-q4-k-m-gguf/*": (component/model-distill-qwen-7b-q4-k-m-gguf)
    prime:
      # Exclude everything not explicitly organized
      - -*

  model-distill-qwen-7b-ov-int4:
    source: components/model-distill-qwen-7b-ov-int4
    plugin: dump
    override-build: |
      # At startup OVMS (single model mode) creates the mediapipe graph file inside the model directory.
      # This directory is read-only when it is inside a component.
      # By adding a symlink with the file's name inside the model directory, pointing to /tmp,
      # OVMS will follow the symlink during runtime and instead create the file in /tmp.
      mediapipe_graph_path="DeepSeek-R1-Distill-Qwen-7B-ov-int4/graph.pbtxt"
      if [ ! -L "$mediapipe_graph_path" ]; then
        ln -s /tmp/graph.pbtxt "$mediapipe_graph_path"
      fi

      craftctl default
    organize:
      "*": (component/model-distill-qwen-7b-ov-int4)

  model-distill-qwen-7b-ov-int4-npu:
    source: components/model-distill-qwen-7b-ov-int4-npu
    plugin: dump
    override-build: |
      mediapipe_graph_path="DeepSeek-R1-Distill-Qwen-7B-ov-int4-npu/graph.pbtxt"
      if [ ! -L "$mediapipe_graph_path" ]; then
        ln -s /tmp/graph.pbtxt "$mediapipe_graph_path"
      fi

      craftctl default
    organize:
      "*": (component/model-distill-qwen-7b-ov-int4-npu)

  llamacpp:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b9611/llamacpp-amd64.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b9611/llamacpp-arm64.tar.gz
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp

      craftctl default
    stage-packages:
      - libgomp1
    organize:
      "*": (component/llamacpp)

  llamacpp-cuda:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b9611/llamacpp-amd64+cuda12.9.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b9611/llamacpp-arm64+cuda12.9.tar.gz
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp-cuda

      craftctl default
    stage-packages:
      - libgomp1
    organize:
      "*": (component/llamacpp-cuda)

  llama-aio: &llama-aio-part
    source: https://github.com/AmpereComputingAI/llama.cpp/releases/download/v3.4.2/llama_aio_v3.4.2_943aee2.tar.gz
    source-type: tar
    plugin: dump
    stage-packages:
      - libcurl4
    organize:
      "LICENSE*.txt": usr/share/doc/llama-aio/
      llama-server: (component/llama-aio)/bin/
      "lib*.so*": (component/llama-aio)/lib/
      "usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/": (component/llama-aio)/lib/
    prime:
      - -*

  llama-aio-ampereone:
    <<: *llama-aio-part
    source: https://github.com/AmpereComputingAI/llama.cpp/releases/download/v3.4.2/llama_aio_v3.4.2_943aee2_ampereone.tar.gz
    organize:
      "LICENSE*.txt": usr/share/doc/llama-aio-ampereone/
      llama-server: (component/llama-aio-ampereone)/bin/
      "lib*.so*": (component/llama-aio-ampereone)/lib/
      "usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/": (component/llama-aio-ampereone)/lib/

  openvino-model-server:
    plugin: dump
    source: https://github.com/openvinotoolkit/model_server/releases/download/v2026.2/ovms_ubuntu24_2026.2.0_python_off.tar.gz
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ]; then
        license_dir=$CRAFT_PRIME/usr/share/doc/openvino-model-server
        mkdir -p $license_dir
        mv LICENSE $license_dir/
        mv thirdparty-licenses $license_dir/

        craftctl default
      fi
    stage-packages:
      - libxml2
      - libcurl4
    organize:
      # move everything, including the staged packages
      "*": (component/openvino-model-server)
    # This part is only for amd64
    override-pull: &amd64-only |
      [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ] && craftctl default || exit 0
    override-stage: *amd64-only
    override-prime: *amd64-only

  # For Intel GPU usage, amd64 only
  intel-compute-runtime:
    source: https://github.com/canonical/intel-compute-runtime-bundle.git
    source-tag: 26.22.38646.4
    plugin: make
    make-parameters:
      - BUNDLE=intel-compute-runtime
    build-packages:
      - wget
    organize:
      # move everything, including the staged packages
      "*": (component/openvino-model-server)

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE-deepseek-r1 $license_dir/

components:
  model-distill-qwen-1-5b-q8-0-gguf:
    type: standard
    summary: DeepSeek R1 Distill Qwen 1.5B Q8_0 GGUF
    description: Quantized model with 1.5B parameters in GGUF format with Q8_0 weight encoding

  model-distill-qwen-7b-q4-k-m-gguf:
    type: standard
    summary: DeepSeek R1 Distill Qwen 7B Q4_K_M GGUF
    description: Quantized model with 7B parameters in GGUF format with Q4_K_M weight encoding

  model-distill-qwen-7b-ov-int4:
    type: standard
    summary: DeepSeek R1 Distill Qwen 7B INT4 OpenVINO
    description: Model with 7B parameters in OpenVINO IR format, quantized to INT4

  model-distill-qwen-7b-ov-int4-npu:
    type: standard
    summary: DeepSeek R1 Distill Qwen 7B INT4 OpenVINO for Intel NPU
    description: Model with 7B parameters in OpenVINO IR format, quantized to INT4 for Intel NPU

  llamacpp:
    type: standard
    summary: llama.cpp using default CPU instruction sets
    description: LLM inference in C/C++

  llamacpp-cuda:
    type: standard
    summary: llama.cpp with CUDA backend
    description: LLM inference in C/C++

  llama-aio:
    type: standard
    summary: llama-aio Engine for Ampere Altra CPUs
    description: LLM inference in C/C++ built by Ampere for Ampere Altra CPUs

  llama-aio-ampereone:
    type: standard
    summary: llama-aio Engine for Ampere One CPUs
    description: LLM inference in C/C++ built by Ampere for Ampere One CPUs

  openvino-model-server:
    type: standard
    summary: OpenVINO Model Server
    description: OpenVINO Model Server for serving models

apps:
  deepseek-r1:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - network
      - hardware-observe
      - opengl
      - home
      - intel-npu
      - npu-libs

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind

lint:
  ignore:
    - metadata:
      - license
      - contact
